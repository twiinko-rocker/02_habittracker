<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Habit Tracker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="card">
      <h1>Mini Habit Tracker</h1>

      <form action="" id="habitForm" novalidate>
        <div class="field">
          <input
            type="text"
            id="habitInput"
            name="habit"
            placeholder="Enter a new habit"
            autocomplete="off"
            required
          />
          <div id="errorText" class="error" aria-live="polite"></div>
        </div>
        <button id="addBtn" type="submit" disabled>Add Habit</button>
      </form>

      <ul id="habitList" aria-label="Habit list"></ul>
    </main>

    <script src="app.js" defer></script>
  </body>
</html>
